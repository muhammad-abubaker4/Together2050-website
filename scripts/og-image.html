<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Together2050 OG image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0b;
        color: #f4efe6;
        font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0b0b0b;
      }

      .watermark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        overflow: hidden;
        padding-top: 76px;
        pointer-events: none;
      }

      .watermark span {
        width: 100%;
        padding-right: 28px;
        text-align: right;
        font-size: 268px;
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.08em;
        color: rgba(255, 255, 255, 0.05);
      }

      header {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
        padding: 0 40px;
        background: rgba(11, 11, 11, 0.7);
      }

      .logo {
        height: 32px;
        width: auto;
        display: block;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      nav span {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(244, 239, 230, 0.8);
      }

      nav span.active {
        color: #fc0000;
      }

      .header-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #fc0000;
        color: #f4efe6;
        border: 1px solid #fc0000;
        padding: 10px 20px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hero {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 562px;
        padding: 0 40px 56px;
      }

      h1 {
        max-width: 820px;
        font-size: 58px;
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: #f4efe6;
      }

      .lede {
        max-width: 560px;
        margin-top: 22px;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.55;
        color: #d6d0c4;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 36px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .btn-primary {
        background: #fc0000;
        border: 1px solid #fc0000;
        color: #f4efe6;
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(244, 239, 230, 0.25);
        color: #f4efe6;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="watermark" aria-hidden="true"><span>2050</span></div>
      <header>
        <img class="logo" src="../src/assets/logos/Together2050.svg" alt="Together2050" />
        <nav>
          <span class="active">Home</span>
          <span>About</span>
          <span>Vision</span>
          <span>What We Do</span>
          <span>Team</span>
          <span>Collaborate</span>
          <span>Contact</span>
        </nav>
        <div class="header-cta">Get Involved</div>
      </header>
      <div class="hero">
        <h1>Together, We Create What Matters.</h1>
        <p class="lede">
          A platform that brings people, ideas, and opportunities together to
          learn, collaborate, contribute, and create meaningful progress toward
          2050 and beyond.
        </p>
        <div class="actions">
          <div class="btn btn-primary">Get Involved</div>
          <div class="btn btn-secondary">Explore Together2050</div>
        </div>
      </div>
    </div>
  </body>
</html>
