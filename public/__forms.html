<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Together2050 contact form</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Static copy for Netlify form detection. The Get Involved contact form is
      rendered by JavaScript, so this file is what the deploy scan reads.
      https://docs.netlify.com/manage/forms/setup
    -->
    <form
      name="contact"
      method="POST"
      action="/"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <p>
        <label>
          Do not fill this in: <input name="bot-field" />
        </label>
      </p>
      <p>
        <label>
          Name <input type="text" name="name" />
        </label>
      </p>
      <p>
        <label>
          Email <input type="email" name="email" />
        </label>
      </p>
      <p>
        <label>
          Subject
          <select name="subject">
            <option value="General Inquiry">General Inquiry</option>
            <option value="General Questions">General Questions</option>
            <option value="Website Feedback">Website Feedback</option>
            <option value="Technical Issues">Technical Issues</option>
            <option value="Other">Other</option>
          </select>
        </label>
      </p>
      <p>
        <label>
          Message <textarea name="message"></textarea>
        </label>
      </p>
    </form>
  </body>
</html>
